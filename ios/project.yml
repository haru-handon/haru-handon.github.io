# XcodeGen 설정. GitHub Actions(macOS)에서 `xcodegen generate`로 HaruHandon.xcodeproj를 만든다.
# 화면은 SwiftUI로 새로 만들었고, 효과음은 안드로이드와 같은 res/raw 의 wav를 그대로 묶는다.
name: HaruHandon
options:
  bundleIdPrefix: com.ohsang.util
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
targets:
  HaruHandon:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Fonts
        buildPhase: resources
      - path: ../android/app/src/main/res/raw
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohsang.util.haruhandon
        PRODUCT_NAME: HaruHandon
        TARGETED_DEVICE_FAMILY: "1"  # iPhone 전용
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 워크플로가 Secrets로 덮어쓴다. 기본값은 Google 테스트 광고
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/1712485313
    dependencies:
      - package: GoogleMobileAds
      - target: HandonWidget
  HandonWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohsang.util.haruhandon.widget
        PRODUCT_NAME: HandonWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  HaruHandon:
    build:
      targets:
        HaruHandon: all
        HandonWidget: all
    archive:
      config: Release
