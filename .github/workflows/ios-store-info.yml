name: App Store 등록 정보 입력

# App Store Connect API로 앱 정보·카테고리·연령 등급·설명·키워드·스크린샷·빌드·심사 메모를 채운다.
# 값: ios/store/metadata.json, 스크린샷: ios/store/screenshots/*.png (store-assets/src/ios_frame.py 로 만든다)
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (TestFlight 업로드와 같은 값)
on:
  workflow_dispatch:

jobs:
  store-info:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: API 키 설치
        env:
          KEY_RAW: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$KEY_RAW" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > "$KEY_FILE"
          else
            printf '%s' "$KEY_RAW" | tr -d ' \r\n\t' | base64 --decode > "$KEY_FILE" 2>/dev/null || true
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "::error title=API 키 형식 오류::ASC_KEY_P8_BASE64 값으로 올바른 .p8 키를 만들 수 없어요"
            exit 1
          fi

      - name: 등록 정보 채우기
        run: node ios/scripts/asc-store-info.mjs
