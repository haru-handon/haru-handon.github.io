name: 스토어 스크린샷

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "store-assets/capture.sh"
      - ".github/workflows/store-screens.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 디버그 APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash store-assets/capture.sh

      - uses: actions/upload-artifact@v4
        with:
          name: store-raw
          path: store-assets/raw/*.png

      - name: store-shots 브랜치에 원본 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots && cp store-assets/raw/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b store-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "store raw ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" store-shots
